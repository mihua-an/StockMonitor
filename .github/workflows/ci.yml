# Every test suite and the lint, on Windows x64 (the only supported platform; the Python locks are Windows-only).
# Same commands as AGENTS.md section 0. No broker SDK, credential or running app is needed.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"

      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Python dependencies (hash-checked locks)
        run: python -m pip install --require-hashes -r requirements/test.lock -r requirements/models.lock

      - name: Node dependencies
        run: |
          npm ci --no-audit --no-fund
          node node_modules/electron/install.js   # the package has no install script: this fetches electron.exe

      - name: Lint (Python)
        run: |
          python -m pip install ruff==0.14.0
          ruff check .

      - name: Lint (JavaScript syntax)
        run: |
          git ls-files '*.js' '*.cjs' '*.mjs' | while read -r f; do node --check "$f" || exit 1; done

      # The integration tests (synthetic end to end, delta batching) run the release
      # executables: built first, and a test that would skip for a missing one fails the run (CX-145).
      - name: Rust release executables
        run: |
          (cd native/market_runtime && cargo build --release --locked)
          (cd native/analysis_runtime && cargo build --release --locked)

      - name: pytest
        env:
          STOCK_MONITOR_REQUIRE_RELEASE_EXES: "1"
        run: python -m pytest tests -q -p no:cacheprovider

      - name: Node contract tests
        run: |
          failed=0
          for f in tests/*.mjs tests/*.cjs; do
            case "$f" in *renderer_ui_geometry.cjs) continue;; esac   # needs a display (Electron window geometry)
            # *_ui.cjs draw in a real Chromium: Electron main scripts (plain node has no `app` in require("electron")).
            runner=node
            case "$f" in *_ui.cjs) runner=node_modules/electron/dist/electron.exe;; esac
            out=$("$runner" "$f" 2>&1) || { echo "FAIL $f"; echo "$out" | tail -n 40; failed=1; }
          done
          exit $failed

      - name: Rust Market Runtime (A)
        working-directory: native/market_runtime
        run: cargo test --locked

      - name: Rust Analysis Runtime (B)
        working-directory: native/analysis_runtime
        run: |
          export STOCK_MONITOR_TEST_MARKET_RUNTIME="$GITHUB_WORKSPACE/native/market_runtime/target/debug/market_runtime_daemon.exe"
          cargo test --locked
